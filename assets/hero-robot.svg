<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162d48"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="520" height="520" rx="20"/>
    </clipPath>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e8e0e0" stroke-width="0.4" opacity="0.12"/>
    </pattern>
    <pattern id="crosshatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e8e0e0" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="520" height="520" rx="20" fill="url(#bg)"/>
  <rect width="520" height="520" rx="20" fill="url(#crosshatch)" clip-path="url(#frame)"/>
  <rect width="520" height="520" rx="20" fill="url(#crosshatch2)" clip-path="url(#frame)"/>

  <g clip-path="url(#frame)">
    <!-- Stars -->
    <g fill="#fff">
      <circle cx="50" cy="40" r="1.5" opacity="0.6"/>
      <circle cx="120" cy="80" r="1" opacity="0.4"/>
      <circle cx="450" cy="60" r="2" opacity="0.7"/>
      <circle cx="380" cy="30" r="1" opacity="0.5"/>
      <circle cx="480" cy="120" r="1.5" opacity="0.4"/>
      <circle cx="60" cy="180" r="1" opacity="0.3"/>
      <circle cx="470" cy="200" r="1.2" opacity="0.5"/>
      <circle cx="30" cy="300" r="1" opacity="0.4"/>
      <circle cx="490" cy="350" r="1.5" opacity="0.3"/>
      <circle cx="40" cy="420" r="1.2" opacity="0.5"/>
      <circle cx="200" cy="30" r="0.8" opacity="0.4"/>
      <circle cx="320" cy="50" r="1.3" opacity="0.6"/>
    </g>

    <!-- City skyline silhouette at bottom -->
    <g fill="#0c1520" stroke="#1a2d45" stroke-width="0.5">
      <rect x="0" y="440" width="520" height="80"/>
      <rect x="20" y="400" width="35" height="120" rx="2"/>
      <rect x="30" y="390" width="15" height="10" fill="#1a2d45"/>
      <rect x="65" y="370" width="25" height="150" rx="1"/>
      <rect x="100" y="410" width="40" height="110" rx="2"/>
      <rect x="110" y="395" width="20" height="15" fill="#1a2d45"/>
      <rect x="150" y="380" width="30" height="140" rx="2"/>
      <rect x="190" y="350" width="20" height="170" rx="1"/>
      <rect x="220" y="420" width="45" height="100" rx="2"/>
      <rect x="275" y="390" width="25" height="130" rx="1"/>
      <rect x="310" y="370" width="35" height="150" rx="2"/>
      <rect x="320" y="355" width="15" height="15" fill="#1a2d45"/>
      <rect x="355" y="400" width="30" height="120" rx="2"/>
      <rect x="395" y="360" width="20" height="160" rx="1"/>
      <rect x="425" y="410" width="40" height="110" rx="2"/>
      <rect x="475" y="385" width="30" height="135" rx="2"/>
    </g>
    <!-- Building windows -->
    <g fill="#348ddb" opacity="0.2">
      <rect x="70" y="380" width="4" height="4" rx="0.5"/>
      <rect x="70" y="390" width="4" height="4" rx="0.5"/>
      <rect x="70" y="400" width="4" height="4" rx="0.5"/>
      <rect x="80" y="380" width="4" height="4" rx="0.5"/>
      <rect x="80" y="390" width="4" height="4" rx="0.5"/>
      <rect x="107" y="420" width="5" height="5" rx="0.5"/>
      <rect x="107" y="430" width="5" height="5" rx="0.5"/>
      <rect x="120" y="420" width="5" height="5" rx="0.5"/>
      <rect x="120" y="430" width="5" height="5" rx="0.5"/>
      <rect x="155" y="390" width="4" height="4" rx="0.5"/>
      <rect x="155" y="400" width="4" height="4" rx="0.5"/>
      <rect x="165" y="390" width="4" height="4" rx="0.5"/>
      <rect x="165" y="400" width="4" height="4" rx="0.5"/>
      <rect x="315" y="380" width="5" height="5" rx="0.5"/>
      <rect x="315" y="392" width="5" height="5" rx="0.5"/>
      <rect x="328" y="380" width="5" height="5" rx="0.5"/>
      <rect x="328" y="392" width="5" height="5" rx="0.5"/>
      <rect x="400" y="370" width="4" height="4" rx="0.5"/>
      <rect x="400" y="380" width="4" height="4" rx="0.5"/>
      <rect x="408" y="370" width="4" height="4" rx="0.5"/>
      <rect x="480" y="395" width="5" height="5" rx="0.5"/>
      <rect x="480" y="407" width="5" height="5" rx="0.5"/>
      <rect x="492" y="395" width="5" height="5" rx="0.5"/>
    </g>

    <!-- Robot figure - large, detailed, manga-style -->
    <!-- Robot legs -->
    <rect x="215" y="370" width="32" height="70" rx="6" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="2"/>
    <rect x="273" y="370" width="32" height="70" rx="6" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="2"/>
    <!-- Leg details -->
    <rect x="220" y="385" width="22" height="4" rx="2" fill="#a0a8b4"/>
    <rect x="278" y="385" width="22" height="4" rx="2" fill="#a0a8b4"/>
    <rect x="220" y="410" width="22" height="3" rx="1.5" fill="#a0a8b4" opacity="0.6"/>
    <rect x="278" y="410" width="22" height="3" rx="1.5" fill="#a0a8b4" opacity="0.6"/>
    <!-- Feet -->
    <rect x="208" y="435" width="46" height="18" rx="6" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1.5"/>
    <rect x="266" y="435" width="46" height="18" rx="6" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1.5"/>

    <!-- Robot torso -->
    <rect x="190" y="195" width="140" height="185" rx="18" fill="#d8dde4" stroke="#2a3a4a" stroke-width="2.5"/>
    <!-- Torso crosshatch shading -->
    <g opacity="0.08" stroke="#2a3a4a" stroke-width="0.6">
      <line x1="195" y1="200" x2="215" y2="220"/>
      <line x1="195" y1="210" x2="215" y2="230"/>
      <line x1="195" y1="220" x2="215" y2="240"/>
      <line x1="195" y1="230" x2="215" y2="250"/>
      <line x1="305" y1="200" x2="325" y2="220"/>
      <line x1="305" y1="210" x2="325" y2="230"/>
      <line x1="305" y1="220" x2="325" y2="240"/>
      <line x1="305" y1="230" x2="325" y2="250"/>
      <line x1="195" y1="330" x2="215" y2="350"/>
      <line x1="195" y1="340" x2="215" y2="360"/>
      <line x1="305" y1="330" x2="325" y2="350"/>
      <line x1="305" y1="340" x2="325" y2="360"/>
    </g>
    <!-- Body panel lines -->
    <line x1="205" y1="215" x2="315" y2="215" stroke="#a0a8b4" stroke-width="1" opacity="0.5"/>
    <line x1="205" y1="310" x2="315" y2="310" stroke="#a0a8b4" stroke-width="1" opacity="0.5"/>
    <!-- Chest plate -->
    <rect x="215" y="230" width="90" height="65" rx="8" fill="#0c1a2a" stroke="#348ddb" stroke-width="2"/>
    <!-- Screen scan lines -->
    <g opacity="0.1">
      <line x1="220" y1="240" x2="300" y2="240" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="245" x2="300" y2="245" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="250" x2="300" y2="250" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="255" x2="300" y2="255" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="260" x2="300" y2="260" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="265" x2="300" y2="265" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="270" x2="300" y2="270" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="275" x2="300" y2="275" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="280" x2="300" y2="280" stroke="#348ddb" stroke-width="0.5"/>
      <line x1="220" y1="285" x2="300" y2="285" stroke="#348ddb" stroke-width="0.5"/>
    </g>
    <!-- Code lines on screen -->
    <rect x="225" y="240" width="45" height="4" rx="2" fill="#348ddb" opacity="0.9"/>
    <rect x="225" y="250" width="65" height="4" rx="2" fill="#e1a730" opacity="0.7"/>
    <rect x="225" y="260" width="35" height="4" rx="2" fill="#4da0e8" opacity="0.8"/>
    <rect x="225" y="270" width="55" height="4" rx="2" fill="#348ddb" opacity="0.6"/>
    <rect x="225" y="280" width="40" height="4" rx="2" fill="#e1a730" opacity="0.5"/>
    <!-- Chest power core -->
    <circle cx="260" cy="330" r="14" fill="#0c1a2a" stroke="#348ddb" stroke-width="2"/>
    <circle cx="260" cy="330" r="8" fill="#348ddb" opacity="0.3"/>
    <circle cx="260" cy="330" r="4" fill="#348ddb" opacity="0.7"/>
    <circle cx="260" cy="330" r="18" fill="none" stroke="#348ddb" stroke-width="0.5" opacity="0.3"/>
    <!-- Bolts on torso -->
    <circle cx="205" cy="205" r="4" fill="#a0a8b4" stroke="#7a8a9a" stroke-width="1"/>
    <circle cx="315" cy="205" r="4" fill="#a0a8b4" stroke="#7a8a9a" stroke-width="1"/>
    <circle cx="205" cy="370" r="4" fill="#a0a8b4" stroke="#7a8a9a" stroke-width="1"/>
    <circle cx="315" cy="370" r="4" fill="#a0a8b4" stroke="#7a8a9a" stroke-width="1"/>

    <!-- Shoulder joints -->
    <circle cx="190" cy="215" r="18" fill="#b8bfc8" stroke="#2a3a4a" stroke-width="2"/>
    <circle cx="190" cy="215" r="8" fill="#a0a8b4" stroke="#7a8a9a" stroke-width="1"/>
    <circle cx="330" cy="215" r="18" fill="#b8bfc8" stroke="#2a3a4a" stroke-width="2"/>
    <circle cx="330" cy="215" r="8" fill="#a0a8b4" stroke="#7a8a9a" stroke-width="1"/>

    <!-- Left arm -->
    <rect x="130" y="220" width="50" height="24" rx="12" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="2"/>
    <rect x="108" y="225" width="30" height="14" rx="7" fill="#b8bfc8" stroke="#2a3a4a" stroke-width="1.5"/>
    <!-- Left hand -->
    <rect x="90" y="222" width="22" height="20" rx="6" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1.5"/>
    <line x1="98" y1="225" x2="98" y2="239" stroke="#7a8a9a" stroke-width="0.8"/>
    <line x1="104" y1="225" x2="104" y2="239" stroke="#7a8a9a" stroke-width="0.8"/>

    <!-- Right arm -->
    <rect x="340" y="220" width="50" height="24" rx="12" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="2"/>
    <rect x="382" y="225" width="30" height="14" rx="7" fill="#b8bfc8" stroke="#2a3a4a" stroke-width="1.5"/>
    <!-- Right hand -->
    <rect x="408" y="222" width="22" height="20" rx="6" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1.5"/>
    <line x1="416" y1="225" x2="416" y2="239" stroke="#7a8a9a" stroke-width="0.8"/>
    <line x1="422" y1="225" x2="422" y2="239" stroke="#7a8a9a" stroke-width="0.8"/>

    <!-- Robot head/helmet -->
    <ellipse cx="260" cy="128" rx="58" ry="62" fill="#d8dde4" stroke="#2a3a4a" stroke-width="2.5"/>
    <!-- Helmet crosshatch shading -->
    <g opacity="0.06" stroke="#2a3a4a" stroke-width="0.5">
      <line x1="210" y1="100" x2="225" y2="115"/>
      <line x1="210" y1="108" x2="225" y2="123"/>
      <line x1="210" y1="116" x2="225" y2="131"/>
      <line x1="295" y1="100" x2="310" y2="115"/>
      <line x1="295" y1="108" x2="310" y2="123"/>
      <line x1="295" y1="116" x2="310" y2="131"/>
    </g>
    <!-- Visor -->
    <ellipse cx="260" cy="120" rx="42" ry="40" fill="#0c1a2a" stroke="#4a6a8a" stroke-width="2"/>
    <!-- Visor glare -->
    <ellipse cx="245" cy="105" rx="16" ry="10" fill="#1a3a5a" opacity="0.35" transform="rotate(-12,245,105)"/>
    <!-- Eyes -->
    <circle cx="242" cy="118" r="11" fill="#348ddb" opacity="0.95"/>
    <circle cx="278" cy="118" r="11" fill="#348ddb" opacity="0.95"/>
    <!-- Eye highlights -->
    <circle cx="238" cy="114" r="4.5" fill="#fff" opacity="0.7"/>
    <circle cx="274" cy="114" r="4.5" fill="#fff" opacity="0.7"/>
    <circle cx="246" cy="122" r="2" fill="#fff" opacity="0.4"/>
    <circle cx="282" cy="122" r="2" fill="#fff" opacity="0.4"/>
    <!-- Eye glow -->
    <circle cx="242" cy="118" r="16" fill="#348ddb" opacity="0.08"/>
    <circle cx="278" cy="118" r="16" fill="#348ddb" opacity="0.08"/>
    <!-- Mouth -->
    <rect x="247" y="142" width="26" height="3" rx="1.5" fill="#348ddb" opacity="0.5"/>
    <!-- Mouth detail dots -->
    <circle cx="250" cy="143.5" r="1" fill="#348ddb" opacity="0.3"/>
    <circle cx="255" cy="143.5" r="1" fill="#348ddb" opacity="0.3"/>
    <circle cx="260" cy="143.5" r="1" fill="#348ddb" opacity="0.3"/>
    <circle cx="265" cy="143.5" r="1" fill="#348ddb" opacity="0.3"/>
    <circle cx="270" cy="143.5" r="1" fill="#348ddb" opacity="0.3"/>

    <!-- Ear pieces -->
    <ellipse cx="202" cy="128" rx="10" ry="18" fill="#b8bfc8" stroke="#2a3a4a" stroke-width="1.5"/>
    <ellipse cx="202" cy="128" rx="4" ry="8" fill="#a0a8b4"/>
    <ellipse cx="318" cy="128" rx="10" ry="18" fill="#b8bfc8" stroke="#2a3a4a" stroke-width="1.5"/>
    <ellipse cx="318" cy="128" rx="4" ry="8" fill="#a0a8b4"/>

    <!-- Antenna -->
    <line x1="260" y1="66" x2="260" y2="35" stroke="#c8cdd4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="28" r="10" fill="#e1a730" stroke="#c8a020" stroke-width="1.5"/>
    <circle cx="260" cy="28" r="5" fill="#f0bb45" opacity="0.9"/>
    <!-- Antenna glow -->
    <circle cx="260" cy="28" r="16" fill="#e1a730" opacity="0.12"/>
    <circle cx="260" cy="28" r="22" fill="#e1a730" opacity="0.05"/>

    <!-- Floating code symbols -->
    <g opacity="0.15" fill="none" stroke="#348ddb" stroke-width="1.5">
      <text x="60" y="130" font-size="28" font-family="monospace" fill="#348ddb" stroke="none">&lt;/&gt;</text>
      <text x="400" y="150" font-size="22" font-family="monospace" fill="#e1a730" stroke="none">{ }</text>
      <text x="70" y="320" font-size="18" font-family="monospace" fill="#4da0e8" stroke="none">01</text>
      <text x="420" y="310" font-size="20" font-family="monospace" fill="#348ddb" stroke="none">fn()</text>
    </g>

    <!-- Floating particles -->
    <circle cx="80" cy="250" r="3" fill="#348ddb" opacity="0.2"/>
    <circle cx="440" cy="270" r="4" fill="#e1a730" opacity="0.18"/>
    <circle cx="60" cy="380" r="3" fill="#4da0e8" opacity="0.15"/>
    <circle cx="450" cy="400" r="3.5" fill="#348ddb" opacity="0.2"/>
    <circle cx="100" cy="70" r="2.5" fill="#e1a730" opacity="0.2"/>
    <circle cx="420" cy="80" r="3" fill="#348ddb" opacity="0.15"/>

    <!-- Circuit traces -->
    <g stroke="#348ddb" stroke-width="1" fill="none" opacity="0.12">
      <path d="M50 300 L80 300 L80 330 L110 330"/>
      <circle cx="110" cy="330" r="3"/>
      <path d="M410 340 L440 340 L440 310 L470 310"/>
      <circle cx="470" cy="310" r="3"/>
      <path d="M50 200 L70 200 L70 220"/>
      <path d="M450 180 L470 180 L470 200"/>
    </g>
  </g>
</svg>
