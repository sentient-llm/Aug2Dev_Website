<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2d45"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#0a1520" stroke="#2a4a6a" stroke-width="2"/>
  <circle cx="100" cy="100" r="96" fill="url(#bg-grad)"/>
  <g clip-path="url(#circle-clip)">
    <!-- Stars/space dots -->
    <circle cx="30" cy="25" r="1.2" fill="#fff" opacity="0.7"/>
    <circle cx="160" cy="35" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="45" cy="60" r="0.8" fill="#fff" opacity="0.4"/>
    <circle cx="170" cy="70" r="1.5" fill="#fff" opacity="0.6"/>
    <circle cx="25" cy="130" r="1" fill="#fff" opacity="0.3"/>
    <circle cx="175" cy="150" r="0.8" fill="#fff" opacity="0.5"/>
    <circle cx="55" cy="170" r="1.2" fill="#fff" opacity="0.4"/>
    <circle cx="150" cy="20" r="0.8" fill="#fff" opacity="0.6"/>
    <circle cx="20" cy="80" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="180" cy="110" r="1.3" fill="#fff" opacity="0.3"/>
    <!-- Robot body base -->
    <rect x="62" y="95" width="76" height="95" rx="10" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="1.5"/>
    <!-- Body panel lines (crosshatch/technical detail) -->
    <line x1="70" y1="110" x2="130" y2="110" stroke="#8a95a5" stroke-width="0.7" opacity="0.5"/>
    <line x1="70" y1="125" x2="130" y2="125" stroke="#8a95a5" stroke-width="0.5" opacity="0.3"/>
    <line x1="70" y1="140" x2="130" y2="140" stroke="#8a95a5" stroke-width="0.5" opacity="0.3"/>
    <line x1="70" y1="155" x2="130" y2="155" stroke="#8a95a5" stroke-width="0.5" opacity="0.3"/>
    <rect x="78" y="115" width="44" height="30" rx="4" fill="#1a2d45" stroke="#4a6a8a" stroke-width="1"/>
    <!-- Chest screen code lines -->
    <rect x="83" y="121" width="22" height="2.5" rx="1" fill="#348ddb" opacity="0.8"/>
    <rect x="83" y="126" width="32" height="2.5" rx="1" fill="#e1a730" opacity="0.6"/>
    <rect x="83" y="131" width="18" height="2.5" rx="1" fill="#4da0e8" opacity="0.7"/>
    <rect x="83" y="136" width="28" height="2.5" rx="1" fill="#348ddb" opacity="0.5"/>
    <!-- Center circle detail on chest -->
    <circle cx="100" cy="160" r="8" fill="none" stroke="#4a6a8a" stroke-width="1.5"/>
    <circle cx="100" cy="160" r="4" fill="#348ddb" opacity="0.6"/>
    <!-- Helmet/head -->
    <ellipse cx="100" cy="70" rx="38" ry="40" fill="#d0d5dc" stroke="#2a3a4a" stroke-width="1.5"/>
    <!-- Helmet visor (glass dome) -->
    <ellipse cx="100" cy="66" rx="30" ry="30" fill="#0c1a2a" stroke="#4a6a8a" stroke-width="1.5"/>
    <!-- Visor reflection -->
    <ellipse cx="90" cy="56" rx="12" ry="8" fill="#1a3a5a" opacity="0.4" transform="rotate(-15, 90, 56)"/>
    <!-- Eyes glowing inside visor -->
    <circle cx="88" cy="66" r="6" fill="#348ddb" opacity="0.9"/>
    <circle cx="112" cy="66" r="6" fill="#348ddb" opacity="0.9"/>
    <circle cx="86" cy="64" r="2.5" fill="#fff" opacity="0.7"/>
    <circle cx="110" cy="64" r="2.5" fill="#fff" opacity="0.7"/>
    <!-- Mouth slit -->
    <rect x="90" y="78" width="20" height="2" rx="1" fill="#348ddb" opacity="0.4"/>
    <!-- Antenna -->
    <line x1="100" y1="30" x2="100" y2="15" stroke="#c8cdd4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="12" r="5" fill="#e1a730"/>
    <circle cx="100" cy="12" r="2.5" fill="#f0bb45" opacity="0.8"/>
    <!-- Antenna glow -->
    <circle cx="100" cy="12" r="8" fill="#e1a730" opacity="0.15"/>
    <!-- Left arm -->
    <rect x="40" y="100" width="22" height="14" rx="7" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="1"/>
    <rect x="30" y="103" width="14" height="8" rx="4" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="0.8"/>
    <!-- Right arm -->
    <rect x="138" y="100" width="22" height="14" rx="7" fill="#c8cdd4" stroke="#2a3a4a" stroke-width="1"/>
    <rect x="156" y="103" width="14" height="8" rx="4" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="0.8"/>
    <!-- Shoulder bolts -->
    <circle cx="65" cy="100" r="4" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1"/>
    <circle cx="135" cy="100" r="4" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1"/>
    <!-- Left leg -->
    <rect x="72" y="188" width="18" height="12" rx="4" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1"/>
    <!-- Right leg -->
    <rect x="110" y="188" width="18" height="12" rx="4" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1"/>
    <!-- Helmet ear pieces -->
    <ellipse cx="62" cy="70" rx="6" ry="10" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1"/>
    <ellipse cx="138" cy="70" rx="6" ry="10" fill="#a0a8b4" stroke="#2a3a4a" stroke-width="1"/>
    <!-- Crosshatch detail lines on body -->
    <g opacity="0.15" stroke="#2a3a4a" stroke-width="0.5">
      <line x1="65" y1="100" x2="75" y2="110"/>
      <line x1="70" y1="100" x2="80" y2="110"/>
      <line x1="120" y1="100" x2="130" y2="110"/>
      <line x1="125" y1="100" x2="135" y2="110"/>
      <line x1="65" y1="150" x2="75" y2="160"/>
      <line x1="70" y1="150" x2="80" y2="160"/>
      <line x1="120" y1="150" x2="130" y2="160"/>
      <line x1="125" y1="150" x2="135" y2="160"/>
    </g>
    <!-- Tech circuit pattern decoration -->
    <g opacity="0.2" stroke="#348ddb" stroke-width="0.6" fill="none">
      <path d="M30 160 L40 160 L40 170 L55 170"/>
      <path d="M145 170 L160 170 L160 160 L170 160"/>
      <circle cx="55" cy="170" r="2"/>
      <circle cx="145" cy="170" r="2"/>
    </g>
  </g>
  <!-- Outer ring glow -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#348ddb" stroke-width="0.5" opacity="0.3"/>
</svg>
